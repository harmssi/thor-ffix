plugins { id 'com.android.application' }

android {
    namespace 'de.harmssi.thorffix'
    compileSdk 35
    defaultConfig {
        applicationId 'de.harmssi.thorffix'
        minSdk 33
        targetSdk 33
        versionCode 5
        versionName '0.3.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // private Sideload-App, Debug-Schlüssel genügt
        }
    }
}
